[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manny"
version = "0.1.0"
description = "Local, hardware-adaptive multi-agent system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
manny = "manny.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manny = ["data/*.yaml", "data/*.Dockerfile", "data/bench/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
